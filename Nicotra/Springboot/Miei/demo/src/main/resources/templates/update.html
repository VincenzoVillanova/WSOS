<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Modifica Ordine</title>
</head>

<body>
    <h2>Modifica Ordine</h2>

    <form action="/orders/update" method="post">
        <input type="hidden" name="id" th:value="${order.id}" />
        <div>
            <label for="name">Nome:</label>
            <input type="text" id="name" name="nome" th:value="${order.nome}" required />
        </div>
        <div>
            <label for="quantity">Quantità:</label>
            <input type="number" id="quantity" name="quantita" th:value="${order.quantita}" required />
        </div>
        <button type="submit">Aggiorna</button>
    </form>

    <a href="/orders/">Torna alla lista ordini</a>
</body>

</html>
