<!DOCTYPE html>
<html lang="en" xmlns="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home squadra</title>
</head>

<body>
    <h1>
        <center>Home squadra</center>
    </h1>

    <table border="1">
        <tr>
            <th>id</th>
            <th>nome</th>
        </tr>
        <tr th:object="${squadra}">
            <td th:text="${squadra.id}"></td>
            <td th:text="${squadra.nome}"></td>
        </tr>
    </table>

    <br><br>
    <h3>Inserisci una nuova squadra:</h3>
    <form action="/squadra/update" method="post" th:object="${squadra}">
        <span>id:</span><input type="number" name="id" th:value="${squadra.id}" readonly>
        <span>nome:</span><input type="text" name="nome" th:value="${squadra.nome}">
        <button>invia</button>
    </form>
</body>

</html>
